name: Python Tests

on:
  pull_request:
    branches:
      - main
  # Manual runs (Actions → Python Tests → Run workflow): lets the matrix —
  # including the Windows leg — be exercised against main without a PR.
  workflow_dispatch:

# Cancel superseded runs for the same PR (or the same manual run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Test results are published by the separate "Test Results" workflow
# (triggered via workflow_run) so PRs from forks/Dependabot — which get a
# read-only GITHUB_TOKEN here — still get results published. See
# .github/workflows/test-results.yml and:
# https://github.com/EnricoMi/publish-unit-test-result-action#support-fork-repositories-and-dependabot-branches
permissions:
  contents: read

jobs:
  test:
    # Windows is a first-class platform: the same full suite runs on both
    # OSes (.gitattributes pins LF so the Windows checkout matches; the
    # runner's Git for Windows provides the Git Bash the shell tools use).
    # timeout-minutes bounds a hung Windows subprocess test — the suite
    # normally finishes well under half of it on the slower Windows runner.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt

      - name: Run tests
        run: |
          pytest tests/ --junitxml=test-results/test-results.xml

      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: Test Results (${{ matrix.os }}, ${{ matrix.python-version }})
          path: test-results/*.xml
          retention-days: 3

  desktop-test:
    # ClawCodex Desktop quality gates on both OSes: typecheck (3 tsconfig
    # projects) + the two vitest projects (ui/jsdom + electron/node). The
    # heavy stages — electron-builder packaging and Playwright — stay
    # local/release-time; this job is the PR-tier gate that keeps the app
    # compiling and its unit surface green, Windows included.
    name: "Desktop (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: ui-desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-desktop/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (ui + electron projects)
        # junit output feeds the same "Test Results" publisher as the pytest
        # legs (test-results.yml globs every artifact for *.xml), because the
        # desktop job's failures are otherwise invisible from outside: job
        # LOGS need an authenticated API call, artifacts do not — and this
        # job spent its first days red on windows-latest with nothing but a
        # ✗ to diagnose from.
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/desktop.xml

      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: Test Results (Desktop, ${{ matrix.os }})
          path: ui-desktop/test-results/*.xml
          retention-days: 3

  web-test:
    # The browser client (ui-web/): typecheck + the vitest suite over the
    # protocol adaptation layer (transcript reducer, gateway client, column
    # solver, markdown) and the production build.
    #
    # The build is part of the gate, not a nicety: `clawcodex web` serves
    # `ui-web/dist`, so a bundle that does not compile is a subcommand that
    # does not run. Linux only — this is browser code with no native deps, and
    # the desktop job already covers the Windows toolchain.
    name: "Web client"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        # junit output feeds the same "Test Results" publisher as the pytest
        # legs (test-results.yml globs every artifact for *.xml).
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/web.xml

      - name: Build
        run: npm run build

      - name: Upload test results
        if: (!cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: Test Results (Web)
          path: ui-web/test-results/*.xml
          retention-days: 3

  harbor-adapter:
    # The harbor eval adapter (eval/harbor/clawcodex_agent.py) cannot be
    # imported by the 3.11 job above: it uses `typing.override` (3.12+) and
    # imports `harbor.*`, which is not a repo dependency. So its tests SKIP
    # there — including the guard on a real defect that shipped in #789, where
    # the adapter reported a fabricated `num_turns: 0` for exactly the killed
    # trials it was added to measure. A guard nobody executes is a comment, so
    # this job runs them on the interpreter the adapter actually runs on.
    #
    # `--isolated` is required, not tidiness: without it `uv run` treats the
    # repo as a project and re-syncs the checkout's venv to 3.13.
    name: "Harbor adapter (3.13)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run adapter tests
        # The harbor-dependent test files ALL belong here. They open with
        # `pytest.importorskip("harbor")`, so in the main `test (3.11)` job —
        # where harbor is not installed — they skip silently and a green tick
        # says nothing about them. This job is the only place they can
        # actually run, so a file omitted here is a file that never runs at
        # all. Add new tests/test_harbor_*.py files to this list.
        run: |
          uv run --isolated --python 3.13 --with harbor --with pytest \
            python -m pytest \
              tests/test_headless_usage_events.py \
              tests/test_harbor_adapter_fusion.py \
              tests/test_harbor_adapter_advisor.py \
              tests/test_harbor_adapter_vision.py \
              tests/test_harbor_adapter_pi.py \
              -v

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Event File
          path: ${{ github.event_path }}